server:
  port: 8087

spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]

  application:
    name: SUBSCRIPTION-SERVICE

  datasource:
    url: ${SUBSCRIPTION_DB_URL}
    username: ${SUBSCRIPTION_DB_USERNAME}
    password: ${SUBSCRIPTION_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

    hikari:
      maximum-pool-size: 2
      minimum-idle: 0
      idle-timeout: 10000
      max-lifetime: 30000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: /

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

app:
  jwt:
    secret: ${JWT_SECRET}

  subscription:
    plans:
      free:
        max-job-posts: 3
        price: 0.0

      professional:
        max-job-posts: 50
        price: 1999.0
        duration-days: 30

      enterprise:
        max-job-posts: 999
        price: 4999.0
        duration-days: 30

  payment:
    razorpay:
      key-id: ${RAZORPAY_KEY_ID}
      key-secret: ${RAZORPAY_KEY_SECRET}

  services:
    auth-url: ${AUTH_SERVICE_URL:http://localhost:8081/api/v1/auth}

  rabbitmq:
    exchange: hireconnect.exchange
    routing-key:
      notification: notification.routing.key

logging:
  level:
    com.hireconnect: DEBUG

springdoc:
  api-docs:
    path: /api-docs

  swagger-ui:
    path: /swagger-ui.html
    enabled: true