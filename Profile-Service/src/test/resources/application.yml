spring:
  datasource:
    url: jdbc:h2:mem:testdb_profile;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

app:
  jwt:
    secret: TestSecretKeyForJWTValidationMustBe256BitsLongForHmacSHA256Algorithm

eureka:
  client:
    enabled: false

logging:
  level:
    com.hireconnect: WARN
