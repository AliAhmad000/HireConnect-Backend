spring:
  datasource:
    url: jdbc:h2:mem:testdb_auth;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: test-client-id
            client-secret: test-secret
            scope: user:email

app:
  jwt:
    secret: TestSecretKeyForJWTValidationMustBe256BitsLongForHmacSHA256Algorithm
    expiration-ms: 86400000
    refresh-expiration-ms: 604800000

eureka:
  client:
    enabled: false

logging:
  level:
    com.hireconnect: WARN
    org.springframework.security: WARN
