server:
  port: 8085

spring:
  application:
    name:  INTERVIEW-SERVICE
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/interview_db
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:1212}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
   
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

app:
  jwt:
    secret: ${JWT_SECRET:HireConnect2024SecretKeyForJWTTokenValidationMustBe256BitsLong}
  rabbitmq:
    exchange: hireconnect.exchange
    routing-key:
      notification: notification.routing.key

logging:
  level:
    com.hireconnect: DEBUG

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
